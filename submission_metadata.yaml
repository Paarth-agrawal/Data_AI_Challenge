methodology_summary: >
  Multi-signal candidate ranking system for Senior AI Engineer role.
  Combines exact skill matching with alias expansion and TF-IDF semantic
  similarity, tiered title scoring, product company career quality,
  location fit, and all 23 Redrob behavioral signals. Includes honeypot
  detection (5 checks), consulting penalty (not disqualification), and
  strengths/concerns reasoning with High/Medium/Low confidence scoring.
  All thresholds centralized in config.py for transparency.
  Processes 100,000 candidates in approximately 4 minutes on CPU only.
  No GPU, no external API calls, fully deterministic.