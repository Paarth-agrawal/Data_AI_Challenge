methodology_summary: >
  Multi-signal candidate ranking system for Senior AI Engineer role.
  Uses tiered skill matching (exact + alias + TF-IDF semantic similarity),
  experience sweet-spot scoring, tiered title matching, product company
  career quality, location fit, and all 23 Redrob behavioral signals.
  Includes honeypot detection, consulting penalty (not disqualification),
  and strengths/concerns reasoning with confidence scoring.
  Processes 100,000 candidates in approximately 4 minutes on CPU only
  with no external API calls and no GPU requirement.