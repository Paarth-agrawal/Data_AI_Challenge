methodology_summary: >
  Multi-signal scoring system that ranks candidates for a Senior AI 
  Engineer role. Evaluates skill match (50pts), experience sweet spot 
  5-9 years (15pts), job title relevance (15pts), product company 
  career quality (10pts), and behavioral signals including open-to-work 
  status, recency, GitHub activity and response rate (15pts). Includes 
  instant disqualifiers for unrelated job functions, consulting-only 
  careers, and honeypot detection. Processes 100K candidates in under 
  3 minutes on CPU only with no external API calls.