methodology_summary: >
  Multi-signal scoring system ranking candidates for a Senior AI Engineer 
  role. Uses skill match against 14 JD requirements (35pts), verified 
  skill assessment scores (5pts), bonus skills (5pts), experience sweet 
  spot 5-9 years (15pts), job title relevance (15pts), product company 
  career quality (10pts), and all 23 Redrob behavioral signals (20pts). 
  Includes instant disqualifiers for unrelated roles, consulting-only 
  careers, junior titles, and honeypot detection. Scores normalized 0-1. 
  Processes 100K candidates in under 3 minutes on CPU only with no 
  external API calls.